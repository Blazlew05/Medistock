version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medistock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medistock
      POSTGRES_USER: medistock
      POSTGRES_PASSWORD: medistock123
    volumes:
      - medistock_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medistock -d medistock"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend_django:
    build: ./backend_django
    container_name: medistock_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend_django:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: medistock
      DB_USER: medistock
      DB_PASSWORD: medistock123
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: django-insecure-cambia-esto-en-produccion
      DEBUG: "True"
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3001
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      WEBPAY_COMMERCE_CODE: ${WEBPAY_COMMERCE_CODE:-}
      WEBPAY_API_KEY: ${WEBPAY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend_vite:
    build: ./frontend_vite
    container_name: medistock_react
    command: npm run dev
    volumes:
      - ./frontend_vite:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend_django

volumes:
  medistock_db_data:
